# Configuración del Agente de Telemetría RustDesk
[SERVER]
# IP o dominio del servidor Linux Debian 12 donde corre la API y RustDesk
host = 192.168.1.100
port = 8000
protocol = http

# Token secreto de autenticación para este cliente
api_token = SECRET_TOKEN_UPT_2026

[CLIENT]
# Identificador nominal del estudiante / máquina
# Opciones para el equipo:
# CLIENT_01_COHAILA | CLIENT_02_LANCHIPA | CLIENT_03_ALVARADO | CLIENT_04_CALDERON | CLIENT_05_LOPEZ | CLIENT_06_ESTEBAN
client_id = CLIENT_01_COHAILA
student_name = COHAILA ALVARADO, GABRIELA ESTEFANIA

[TELEMETRY]
# Intervalo de envío de telemetría de estado (segundos)
heartbeat_interval = 5

# Umbral para considerar que la máquina está inactiva (segundos sin mouse ni teclado)
idle_threshold_seconds = 60

# Habilitar captura de eventos de Sysmon (EID 1 y EID 11)
enable_sysmon = true

# Intervalo automático de capturas de pantalla de supervisión (segundos, 0 = solo bajo demanda)
auto_screenshot_interval = 300

# Calidad de compresión JPEG de la captura de pantalla (1 - 100)
screenshot_quality = 65
